name: Release

# Every push to main is a downloadable build. No notarization: the zip is
# ad-hoc signed, and the first open needs a right-click → Open.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build tools
        run: brew install xcodegen librsvg

      - name: Version
        id: version
        run: |
          set -euo pipefail
          base=$(sed -n 's/^    MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          test -n "$base"
          echo "version=${base}.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Build (ad-hoc)
        run: ./build.sh
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          CODE_SIGN_IDENTITY: "-"

      - name: Verify the app icon compiled into the bundle
        run: |
          set -euo pipefail
          test -f dist/Amped.app/Contents/Resources/Assets.car
          test -d dist/Amped.app/Contents/PlugIns/AmpedControl.appex
          name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" dist/Amped.app/Contents/Info.plist)
          [ "$name" = "AppIcon" ] || { echo "CFBundleIconName is '$name', expected AppIcon"; exit 1; }

      - name: Zip
        run: ditto -c -k --keepParent dist/Amped.app "Amped-${VERSION}.zip"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "Amped-${VERSION}.zip" \
            --title "Amped ${VERSION}" \
            --notes "Unsigned build from main. Not notarized, so the first time you open it, right-click the app and choose Open."
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
